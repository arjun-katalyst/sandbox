# Katalyst Exam settings. Apply changes with:  sudo katalyst-exam-admin apply

# Exam rounds. After login the invigilator picks one from a full-screen menu
# (with a single round, it opens directly). Format:
#   ROUND_<number>=<button label>|<https URL>              (Firefox round)
#   ROUND_<number>=<button label>|terminal:<challenge-name> (restricted-terminal coding round, 45 min)
# <challenge-name> must match a folder under /usr/share/katalyst-exam/challenge/.
ROUND_1=ML round|https://www.kaggle.com/datasets/fireblade098/classification
ROUND_2=Coding round|terminal:vault-crypto

# Used only if no ROUND_ lines are set.
START_URL=https://www.kaggle.com/

# Allow the exam user to mount USB drives / phones.
# "no" (recommended): students cannot bring files in.
ALLOW_USB=no

# Force the X11 fallback session instead of Wayland (cage).
# Leave "no" unless the Wayland session fails on a machine (e.g. NVIDIA).
FORCE_X11=no
