// Katalyst Exam — Firefox autoconfig (this first line must stay a comment).
//
// Active ONLY inside the exam session (exam-session sets KATALYST_EXAM_SESSION=1),
// so other users of Firefox ESR on the machine are not affected.
//
// Enforces:
//   * exactly one browser window and one tab
//   * links / pop-ups that want a new tab or window open in the exam tab,
//     keeping normal Back / Forward history
//   * browser shortcuts for tabs, windows, history, files, etc. disabled
if (getenv("KATALYST_EXAM_SESSION") === "1") {
  try {
    // Links with target=_blank and window.open() open as tabs (never windows);
    // the TabOpen handler below moves them into the exam tab.
    lockPref("browser.link.open_newwindow", 3);
    lockPref("browser.link.open_newwindow.restriction", 0);
    lockPref("browser.link.open_newwindow.override.external", 1);
    lockPref("browser.tabs.closeWindowWithLastTab", true);
    lockPref("browser.tabs.allowTabDetach", false);

    // Shortcut <key> ids in the browser window to disable.
    // Kept enabled: find (Ctrl+F), reload, Alt+Home, quit (Ctrl+Q, invigilator exit).
    const BLOCKED_KEYS = [
      "key_newNavigatorTab",            // Ctrl+T       new tab
      "key_newNavigator",               // Ctrl+N       new window
      "key_privatebrowsing",            // Ctrl+Shift+P private window
      "key_undoCloseTab",               // Ctrl+Shift+T reopen tab
      "key_restoreLastClosedTabOrWindowOrSession",
      "key_undoCloseWindow",            // Ctrl+Shift+N reopen window
      "key_close",                      // Ctrl+W       close tab
      "key_closeWindow",                // Ctrl+Shift+W close window
      "focusURLBar", "focusURLBar2",    // Ctrl+L / Alt+D address bar
      "key_search", "key_search2",      // Ctrl+K / Ctrl+J search bar
      "key_gotoHistory",                // Ctrl+H       history sidebar
      "showAllHistoryKb",               // Ctrl+Shift+H history library
      "viewBookmarksSidebarKb",         // Ctrl+B       bookmarks sidebar
      "viewBookmarksToolbarKb",         // Ctrl+Shift+B bookmarks toolbar
      "viewGenaiChatSidebarKb",         // Ctrl+Alt+X   AI chatbot sidebar
      "viewOpenTabsSidebarKb",          // Ctrl+Alt+U   open tabs sidebar
      "toggleSidebarKb",                // Ctrl+Alt+Z   sidebar
      "key_showAllTabs",                // Ctrl+Shift+Tab all-tabs list
      "key_togglePictureInPicture",     // Ctrl+Shift+] picture-in-picture
      "manBookmarkKb",                  // Ctrl+Shift+O bookmarks library
      "addBookmarkAsKb",                // Ctrl+D
      "bookmarkAllTabsKb",
      "key_openDownloads",              // Ctrl+Shift+Y downloads library
      "key_openAddons",                 // Ctrl+Shift+A add-ons
      "key_sanitize",                   // Ctrl+Shift+Del
      "openFileKb",                     // Ctrl+O       open file
      "key_savePage",                   // Ctrl+S       save page
      "printKb",                        // Ctrl+P       print
      "key_viewSource",                 // Ctrl+U       view source
      "key_viewInfo",                   // Ctrl+I       page info
      "key_screenshot",                 // Ctrl+Shift+S screenshot
      "key_toggleReaderMode",
      "key_browserConsole",             // Ctrl+Shift+J
      // Developer tools (also blocked by policy; keys disabled for good measure)
      "key_toggleToolbox", "key_browserToolbox", "key_responsiveDesignMode",
      "key_inspector", "key_webconsole", "key_jsdebugger", "key_netmonitor",
      "key_dom", "key_styleeditor", "key_performance", "key_storage",
    ];

    const log = (msg) => {
      try { console.error("[katalyst-exam] " + msg); } catch (e) {}
    };

    const ROUND = getenv("KATALYST_EXAM_ROUND") || "";

    // Slim exam bar (kiosk mode hides Firefox's own toolbar): Back, Forward,
    // Reload, Exam home, and the round name. No address bar.
    const addNavBar = (win, gBrowser) => {
      try {
        const doc = win.document;
        if (doc.getElementById("katalyst-exam-bar")) return;
        const HTML = "http://www.w3.org/1999/xhtml";
        const el = (tag, style, text) => {
          const e = doc.createElementNS(HTML, tag);
          if (style) e.setAttribute("style", style);
          if (text) e.textContent = text;
          return e;
        };

        const bar = el("div",
          "display:flex; align-items:center; gap:8px; height:40px; min-height:40px;" +
          "padding:0 12px; background:#1d2430; color:#e8ecf2;" +
          "font:14px system-ui, sans-serif; border-bottom:1px solid #2c3544;");
        bar.id = "katalyst-exam-bar";

        const BTN = "height:30px; padding:0 14px; border:none; border-radius:8px;" +
                    "background:#2f6fdb; color:#fff; font:14px system-ui, sans-serif;" +
                    "cursor:pointer;";
        const BTN_OFF = "background:#3a4454; color:#8f9bad; cursor:default;";

        const mk = (label, title, action) => {
          const b = el("button", BTN, label);
          b.setAttribute("title", title);
          b.addEventListener("click", () => { try { action(); } catch (e) { log(e); } });
          bar.appendChild(b);
          return b;
        };
        const back = mk("←  Back", "Back (Alt+Left)", () => gBrowser.goBack());
        const fwd = mk("Forward  →", "Forward (Alt+Right)", () => gBrowser.goForward());
        mk("⟳  Reload", "Reload (F5)", () => gBrowser.reload());
        mk("⌂  Exam home", "Back to this round's Kaggle page (Alt+Home)", () => {
          if (win.BrowserCommands && win.BrowserCommands.home) win.BrowserCommands.home();
          else win.BrowserHome();
        });

        bar.appendChild(el("div", "flex:1"));
        bar.appendChild(el("div",
          "font-weight:bold; letter-spacing:2px; color:#6f9cff; font-size:12px;",
          "KATALYST.AI · EXAM" + (ROUND ? "  —  " + ROUND.toUpperCase() : "")));

        const setEnabled = (b, on) => {
          b.disabled = !on;
          b.setAttribute("style", on ? BTN : BTN + BTN_OFF);
        };
        const update = () => {
          setEnabled(back, gBrowser.canGoBack);
          setEnabled(fwd, gBrowser.canGoForward);
        };
        gBrowser.addProgressListener({
          onLocationChange() { update(); },
          onStateChange() { update(); },
        });
        update();

        // Place the bar directly above the page area.
        const anchor = doc.getElementById("browser");
        if (anchor && anchor.parentNode) {
          anchor.parentNode.insertBefore(bar, anchor);
        } else {
          bar.style.position = "fixed";
          bar.style.top = "0"; bar.style.left = "0"; bar.style.right = "0";
          bar.style.zIndex = "10000";
          doc.documentElement.appendChild(bar);
        }
      } catch (e) {
        log("nav bar error: " + e);
      }
    };

    const lockDownWindow = (win) => {
      if (!win || !win.gBrowser || win.__katalystExam) {
        return;
      }
      win.__katalystExam = true;

      // Only one browser window may exist.
      let count = 0;
      for (const w of Services.wm.getEnumerator("navigator:browser")) {
        if (!w.closed) count++;
      }
      if (count > 1) {
        log("closing extra window");
        win.close();
        return;
      }

      // Disable shortcuts.
      const doc = win.document;
      for (const id of BLOCKED_KEYS) {
        const key = doc.getElementById(id);
        if (key) {
          key.removeAttribute("command");
          key.removeAttribute("oncommand");
          key.setAttribute("disabled", "true");
        }
      }

      const gBrowser = win.gBrowser;
      addNavBar(win, gBrowser);

      // Only one tab may exist: close any extra tab as soon as it opens.
      const trimTabs = () => {
        const keep = gBrowser.selectedTab;
        for (const tab of [...gBrowser.tabs]) {
          if (tab !== keep && !tab.closing) {
            gBrowser.removeTab(tab, { animate: false, skipPermitUnload: true });
          }
        }
      };
      // A link that wants a new tab (target=_blank, window.open) is let open in
      // a new tab, and as soon as that tab knows its URL the URL is loaded in
      // the exam tab instead — so it lands in the exam tab's normal Back /
      // Forward history — and the extra tab is closed. Tabs that never get a
      // real URL (Ctrl+T-style blank tabs, downloads) are simply closed.
      const SYSTEM = Services.scriptSecurityManager.getSystemPrincipal();
      const pending = new Map();  // new tab's browser -> { opened, origin }
      let examTab = gBrowser.selectedTab;

      const isBlank = (spec) => spec === "about:blank" ||
        spec.startsWith("about:newtab") || spec.startsWith("about:home");

      const finish = (browser, uri) => {
        const entry = pending.get(browser);
        if (!entry) return;
        pending.delete(browser);
        const { opened, origin } = entry;
        try { browser.stop(); } catch (e) {}
        if (uri && !origin.closing) {
          log("moving new-tab link into the exam tab: " + uri.spec);
          origin.linkedBrowser.loadURI(uri, { triggeringPrincipal: SYSTEM });
        }
        if (!origin.closing) gBrowser.selectedTab = origin;
        if (!opened.closing) {
          gBrowser.removeTab(opened, { animate: false, skipPermitUnload: true });
        }
      };

      gBrowser.addTabsProgressListener({
        onLocationChange(browser, webProgress, request, location) {
          if (!pending.has(browser) || !webProgress || !webProgress.isTopLevel) return;
          if (!location || isBlank(location.spec)) return;
          finish(browser, location);
        },
      });

      gBrowser.tabContainer.addEventListener("TabSelect", (ev) => {
        if (!pending.has(ev.target.linkedBrowser)) examTab = ev.target;
      });

      gBrowser.tabContainer.addEventListener("TabOpen", (ev) => {
        const opened = ev.target;
        const origin = (examTab && examTab !== opened && !examTab.closing)
          ? examTab
          : [...gBrowser.tabs].find((t) => t !== opened && !t.closing);
        if (!origin) return;
        pending.set(opened.linkedBrowser, { opened, origin });
        // Keep the student on the exam tab while the new tab resolves.
        if (gBrowser.selectedTab === opened) gBrowser.selectedTab = origin;
        // Blank tabs (nothing loading) are closed quickly; anything else
        // gets a few seconds to report its URL, then is closed regardless.
        win.setTimeout(() => {
          const b = opened.linkedBrowser;
          if (pending.has(b) && b.currentURI && isBlank(b.currentURI.spec) &&
              !(b.webProgress && b.webProgress.isLoadingDocument)) {
            finish(b, null);
          }
        }, 1500);
        win.setTimeout(() => finish(opened.linkedBrowser, null), 8000);
      });
      // Session restore after a relaunch could bring back more than one tab.
      win.setTimeout(trimTabs, 2000);
    };

    Services.obs.addObserver((subject) => lockDownWindow(subject),
                             "browser-delayed-startup-finished");
  } catch (e) {
    try { console.error("[katalyst-exam] autoconfig error: " + e); } catch (_) {}
  }
}
